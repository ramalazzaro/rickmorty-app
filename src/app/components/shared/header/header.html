<nav class="navbar navbar-expand bg-dark" data-bs-theme="dark">
  <div class="container flex-wrap">
    <a class="navbar-brand" routerLink="/">Rick and Morty Wiki</a>

    <ul class="navbar-nav me-auto">
      <li class="nav-item">
        <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          Personajes
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" [routerLink]="['/episodios']" routerLinkActive="active">Episodios</a>
      </li>
    </ul>

    @if (userService.user(); as user) {
      <span class="navbar-text me-3">Hola, {{ user.email }}</span>
      <button class="btn btn-outline-light btn-sm" (click)="userService.logout()">Salir</button>
    } @else {
      <a class="btn btn-success btn-sm" routerLink="/login">Login</a>
    }
  </div>
</nav>
